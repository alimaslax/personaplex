events {}

http {
    # Keep ingress diagnostics in the replica log stream. This makes it clear
    # whether a failed public request reached Nginx or stopped at the platform
    # gateway before it entered the container.
    access_log /dev/stdout;
    error_log /dev/stderr info;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;
        client_max_body_size 50m;

        # The platform must be able to keep the container alive while the
        # first boot downloads PersonaPlex into the persistent /data disk.
        location = /health {
            default_type application/json;
            return 200 '{"status":"starting"}\n';
        }

        location /gradio/ {
            proxy_pass http://127.0.0.1:7861/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /gradio;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://127.0.0.1:8998;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
