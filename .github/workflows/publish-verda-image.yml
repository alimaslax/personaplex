name: Publish PersonaPlex Verda image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verda
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/personaplex-verda:${{ inputs.tag }}
