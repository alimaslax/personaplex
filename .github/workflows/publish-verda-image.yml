name: Publish PersonaPlex Verda image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.verda
      - moshi/**
      - runtime/verda/**
      - .github/workflows/publish-verda-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/personaplex-verda
  IMAGE_TAG: ${{ inputs.tag || github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verda
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
